<style>
/* Layout: app bar with View/Edit; View = case-file ledger with swimlane overview + dispute sidebar; Edit = list/form split panes. Tokens follow the OSINT Citation Generator family. */
:root {
  --bg: #EEF2F5; --surface: #FFFFFF; --sheet: #F7F9FB; --ink: #13222C; --muted: #566977; --faint: #8796A2; --line: #CCD6DE;
  --accent: #0F4761; --accent-ink: #FFFFFF; --accent-soft: #DFEBF1; --hi: #FFF4CC;
  --z-green: #C6E0B4; --z-yellow: #FFE699; --z-orange: #F8CBAD; --z-red: #FF9999; --z-gray: #D9D9D9; --z-ink: #1B242B;
  --fix: #9E2219; --fix-bg: #FBE3E0; --check: #6F4B00; --check-bg: #FBEDC4; --ok: #2A6637;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-read: 'Iowan Old Style', 'Charter', 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif;
  --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D151B; --surface: #152029; --sheet: #1A2630; --ink: #E3EAEF; --muted: #94A6B3; --faint: #6C7D89; --line: #2C3B46;
  --accent: #8CC4DD; --accent-ink: #0B1A22; --accent-soft: #1C323E; --hi: #3A3216;
  --z-green: #35603A; --z-yellow: #7A6520; --z-orange: #8A5330; --z-red: #8A3636; --z-gray: #46525B; --z-ink: #F1F5F7;
  --fix: #FFA79C; --fix-bg: #3F1D1A; --check: #F2CD6B; --check-bg: #3A2E10; --ok: #8FD19E; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D151B; --surface: #152029; --sheet: #1A2630; --ink: #E3EAEF; --muted: #94A6B3; --faint: #6C7D89; --line: #2C3B46;
  --accent: #8CC4DD; --accent-ink: #0B1A22; --accent-soft: #1C323E; --hi: #3A3216;
  --z-green: #35603A; --z-yellow: #7A6520; --z-orange: #8A5330; --z-red: #8A3636; --z-gray: #46525B; --z-ink: #F1F5F7;
  --fix: #FFA79C; --fix-bg: #3F1D1A; --check: #F2CD6B; --check-bg: #3A2E10; --ok: #8FD19E; color-scheme: dark; }
* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui) }
a { color: var(--accent) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1200px; margin: 0 auto }
code { font-family: var(--font-mono); font-size: .92em }
[hidden] { display: none !important }

/* app bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface) }
.appbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px }
.brand { font-weight: 700; font-size: 14px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; white-space: nowrap }
.brand svg { flex: none }
.brand small { font-weight: 400; color: var(--muted) }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.tabs button { border: 0; background: transparent; padding: 5px 14px; cursor: pointer; font-weight: 500; font-size: 13.5px }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink) }
.spacer { flex: 1 }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--fix); border-color: var(--fix) }
.btn.small { padding: 3px 8px; font-size: 12.5px }
.btn.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px }
.menu { position: relative }
.menu > summary { list-style: none }
.menu > summary::-webkit-details-marker { display: none }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); min-width: 270px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; display: grid; z-index: 40 }
.menu-pop button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13.5px }
.menu-pop button:hover { background: var(--accent-soft) }
.menu-pop small { display: block; color: var(--muted); font-size: 12px }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0 }
.status { font-size: 12px; color: var(--muted); white-space: nowrap }
select.theme { font-size: 12.5px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }

/* ---------- VIEW ---------- */
.v-head { padding-block: 34px 14px; display: grid; gap: 10px }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
.v-title { font-family: var(--font-read); font-weight: 600; font-size: clamp(32px, 5vw, 50px); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em }
.dek { max-width: 70ch; color: var(--muted); font-size: 16px; margin: 0 }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted) }
.meta b { color: var(--ink); font-weight: 600 }
.meta .vtag { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--ink) }
.foot .vline { margin: 0 0 6px }
.overview { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 6px; margin-block: 6px 16px }
.overview h2 { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-weight: 500 }
.ov-scroll { overflow-x: auto }
.lanes { display: block; width: 100%; height: auto; min-width: 720px }
.lanes text { font-family: var(--font-mono); font-size: 10.5px; fill: var(--muted) }
.lanes .ll { font-family: var(--font-ui); font-size: 11.5px; fill: var(--ink) }
.lanes .g { stroke: var(--line); stroke-width: 1 }
.lanes circle { cursor: pointer }
.lanes circle:hover { stroke: var(--ink); stroke-width: 1.5 }
.lanes .dim { opacity: .15 }
.vbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h, 46px)); z-index: 10; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.search { flex: 1 1 240px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }
.chip { font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer }
.chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c) }
.chip .n { color: var(--faint); font-family: var(--font-mono); font-size: 11px }
.chip[aria-pressed="false"] { color: var(--faint); background: transparent }
.chip[aria-pressed="false"] .sw { background: transparent; border: 1.5px solid var(--c) }
.chip.zone .sw { border-radius: 2px; background: var(--zc); border: 1px solid var(--line) }
.chip.zone[aria-pressed="false"] .sw { background: transparent }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: auto }
.vgrid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; padding-block: 16px 60px }
@media (max-width: 920px) { .vgrid { grid-template-columns: minmax(0, 1fr) } .side { order: -1 } }
.year { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 0 14px; margin-bottom: 6px }
.year-h { font-family: var(--font-read); font-size: 30px; font-weight: 600; line-height: 1; padding-top: 12px }
.entries { border-left: 1px solid var(--line) }
.ev { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 14px; padding: 12px 0 12px 14px; border-top: 1px solid var(--line); position: relative; scroll-margin-top: 170px }
.entries .ev:first-child { border-top: 0 }
.ev::before { content: ""; position: absolute; left: -4px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: var(--c) }
.ev.key::before { left: -6px; top: 15px; width: 11px; height: 11px; box-shadow: 0 0 0 3px var(--bg) }
.ev.flash { background: var(--hi) }
.date { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums }
.date .p { display: block; font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em }
.txt { font-family: var(--font-read); font-size: 17px; line-height: 1.45; margin: 0; max-width: 72ch; overflow-wrap: anywhere }
.ev.key .txt { font-weight: 600 }
.tags { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 5px; font-size: 12px; color: var(--muted); align-items: center }
.tag-thread { color: var(--c); font-weight: 600 }
.badge { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted) }
.rate { font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px; background: var(--zc); color: var(--z-ink) }
details.src { margin-top: 6px }
details.src > summary { cursor: pointer; font-size: 12.5px; color: var(--accent); list-style: none; display: inline-flex; gap: 6px; align-items: center }
details.src > summary::-webkit-details-marker { display: none }
details.src > summary::before { content: "▸"; font-size: 10px; transition: transform .15s }
details.src[open] > summary::before { transform: rotate(90deg) }
.cites { display: grid; gap: 8px; margin-top: 8px }
.cite { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; min-width: 0 }
.fn { font-family: var(--font-read); font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere }
.fn a { overflow-wrap: anywhere }
.cite blockquote { margin: 7px 0 0; font-family: var(--font-read); font-style: italic; font-size: 14px; border-left: 2px solid var(--line); padding-left: 9px; overflow-wrap: anywhere }
.cite .cnote, .notes { font-size: 12.5px; color: var(--muted); margin-top: 5px; overflow-wrap: anywhere }
.notes b { color: var(--ink) }
.empty { padding: 40px 0; color: var(--muted) }
.side { display: grid; gap: 16px; position: sticky; top: 160px; max-height: calc(100vh - 180px); overflow: auto; padding-right: 2px }
@media (max-width: 920px) { .side { position: static; max-height: none; overflow: visible } .vbar { position: static } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px }
.panel h3 { font-family: var(--font-read); font-size: 19px; margin: 0 0 4px }
.panel .sub { font-size: 12.5px; color: var(--muted); margin: 0 0 8px }
.panel details { border-top: 1px solid var(--line); padding: 8px 0 }
.panel details summary { cursor: pointer; font-weight: 500; font-size: 13.5px }
.panel details p { font-size: 13px; margin: 6px 0 }
.panel ul { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 7px }
.refs { display: flex; flex-wrap: wrap; gap: 4px }
.refs button { font: 11px var(--font-mono); padding: 2px 6px; border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--accent); cursor: pointer }
.legend { display: grid; gap: 6px; font-size: 12.5px }
.legend div { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px }
.legend .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-top: 5px }
.legend small { display: block; color: var(--muted) }
.zgrid { display: grid; grid-template-columns: auto repeat(6, 1fr); gap: 2px; font: 10.5px var(--font-mono); margin-top: 6px }
.zgrid span { text-align: center; padding: 2px 0; border-radius: 2px; color: var(--z-ink) }
.zgrid .h { color: var(--muted); background: none }
.foot { padding-block: 24px 40px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line) }
@media (max-width: 560px) {
  .year { grid-template-columns: minmax(0, 1fr) } .year-h { padding: 16px 0 4px }
  .ev { grid-template-columns: minmax(0, 1fr) }
}

/* ---------- EDIT ---------- */
.etabs { display: flex; flex-wrap: wrap; gap: 4px; padding-block: 14px 10px; border-bottom: 1px solid var(--line) }
.etabs button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; color: var(--muted) }
.etabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink) }
.etabs .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); margin-left: 3px }
.split { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 20px; padding-block: 16px 60px; align-items: start }
@media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr) } }
.listcol { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h, 46px) + 10px); max-height: calc(100vh - 90px); min-width: 0 }
@media (max-width: 860px) { .listcol { position: static; max-height: 46vh } }
.list { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 120px }
.li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0 }
.li:hover { background: var(--sheet) }
.li[aria-current="true"] { background: var(--accent-soft) }
.li .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-top: 6px }
.li .l1 { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.li .l2 { font: 11.5px var(--font-mono); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap }
.li .warn { color: var(--fix) }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 14px; min-width: 0 }
.form h2 { font-family: var(--font-read); font-size: 22px; margin: 0 }
.form h3 { font-family: var(--font-read); font-size: 17px; margin: 18px 0 0 }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.field { display: grid; gap: 4px; min-width: 0; align-content: start }
.field > span { font-size: 12.5px; font-weight: 600 }
.field > small { font-size: 12px; color: var(--muted) }
.field input[type=text], .field input:not([type]), .field select, .field textarea, .inp { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); min-width: 0 }
.field textarea { resize: vertical; min-height: 64px }
.field.wide { grid-column: 1 / -1 }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px }
fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; min-width: 0 }
legend { font-size: 12.5px; font-weight: 600; padding: 0 4px }
.citeed { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; background: var(--sheet) }
.citeed .top { display: grid; grid-template-columns: minmax(0, 1fr) 160px auto; gap: 8px; align-items: end }
@media (max-width: 560px) { .citeed .top { grid-template-columns: minmax(0, 1fr) } }
.preview { font-family: var(--font-read); font-size: 14px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--surface); overflow-wrap: anywhere }
.checks { display: grid; gap: 4px; font-size: 12.5px }
.checks div { padding: 4px 8px; border-radius: 4px }
.checks .fix { background: var(--fix-bg); color: var(--fix) }
.checks .check { background: var(--check-bg); color: var(--check) }
.checks .note { background: var(--accent-soft); color: var(--ink) }
.quals { display: grid; gap: 8px }
.quals .grp { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px }
.quals .grp b { width: 100%; font-size: 12px; color: var(--muted); font-weight: 600 }
.rating-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px }
.trow { display: grid; grid-template-columns: 120px minmax(120px, 1fr) minmax(0, 2fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line) }
@media (max-width: 700px) { .trow { grid-template-columns: 1fr 1fr } }
.swatches { display: flex; flex-wrap: wrap; gap: 4px }
.swatches button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; background: var(--c); cursor: pointer; padding: 0 }
.swatches button[aria-pressed="true"] { border-color: var(--ink) }
.audit { display: grid; gap: 6px }
.audit .item { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 13.5px; padding: 6px 8px; border-radius: 6px }
.audit .item.fix { background: var(--fix-bg) } .audit .item.check { background: var(--check-bg) }
.audit .lvl { font: 600 11px var(--font-mono); text-transform: uppercase; padding-top: 2px }
.audit .fix .lvl { color: var(--fix) } .audit .check .lvl { color: var(--check) }
.ok { color: var(--ok); font-weight: 600 }
.hint { font-size: 13px; color: var(--muted); margin: 0 }
.dlist { display: grid; gap: 12px }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(5, 12, 18, .5); z-index: 50; display: grid; place-items: center; padding: 16px }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px; display: grid; gap: 12px }
.modal h3 { margin: 0; font-family: var(--font-read); font-size: 21px }
.modal p { margin: 0; font-size: 14px }
.modal textarea { width: 100%; min-height: 160px; font: 12px var(--font-mono); padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet) }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13.5px; z-index: 60; max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
@media print { .appbar, .vbar, .side, .overview { display: none } }
</style>
