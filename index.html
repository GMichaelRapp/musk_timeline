ions","titleStyle":"quotes","location":"The Wall Street Journal","descType":"News Article","date":"23 October 2026","dateKind":"updated","url":"https://www.wsj.com/world/trump-called-musk-and-asked-him-to-lift-ukraine-starlink-restrictions-5aeebc6e?st=gQuYPZ","type":"news","access":["paywalled"],"quals":[]}}],"events":[{"id":"e1","date":"2022-02-26","end":"","prec":"exact","thread":"service","key":true,"text":"Ukraine's Vice Prime Minister Mykhailo Fedorov publicly asked Elon Musk on Twitter to provide Ukraine with Starlink stations. Musk replied the same day that Starlink service was active in Ukraine and more terminals were on the way.","actors":"Mykhailo Fedorov; Elon Musk; SpaceX","cites":[{"src":"s140","loc":"post","quote":"@elonmusk, while you try to colonize Mars — Russia try to occupy Ukraine! While your rockets successfully land from space — Russian rockets attack Ukrainian civil people! We ask you to provide Ukraine with Starlink stations and to address sane Russians to stand.","note":""},{"src":"s2","loc":"Fedorov tweet quoted in para. 2","quote":"We ask you to provide Ukraine with Starlink stations","note":""},{"src":"s3","loc":"paras. 5–7","quote":"","note":""}],"notes":""},{"id":"e2","date":"2022-02-28","end":"","prec":"exact","thread":"service","key":false,"text":"Fedorov announced on Telegram that the first batch of Starlink terminals had arrived in Ukraine and thanked Musk.","actors":"Mykhailo Fedorov; Elon Musk","cites":[{"src":"s4","loc":"para. 3","quote":"The first batch of StarLink satellite Internet stations has arrived in Ukraine!","note":""},{"src":"s5","loc":"headline","quote":"","note":""},{"src":"s141","loc":"post","quote":"Starlink service is now active in Ukraine. More terminals en route.","note":""}],"notes":""},{"id":"e3","date":"2022-03-14","end":"","prec":"exact","thread":"musk","key":false,"text":"Musk tweeted a challenge to Vladimir Putin to 'single combat', with Ukraine as the stakes.","actors":"Elon Musk; Vladimir Putin","cites":[{"src":"s6","loc":"tweet quoted in para. 2","quote":"I hereby challenge Владимир Путин (Vladimir Putin) to single combat","note":""},{"src":"s142","loc":"post","quote":"","note":""}],"notes":"Vladimir Putin (obviously) didn't respond to Musk's challenge."},{"id":"e4","date":"2022-05-08","end":"","prec":"approx","thread":"kremlin","key":false,"text":"After Roscosmos head Dmitry Rogozin said Musk would be 'held accountable' for supplying Ukraine's forces with communications equipment, Musk tweeted a half-joking farewell in case he died 'under mysterious circumstances.'","actors":"Elon Musk; Dmitry Rogozin; Roscosmos","cites":[{"src":"s7","loc":"para. 2; paras. 8–9","quote":"If I die under mysterious circumstances, it's been nice knowin ya","note":""},{"src":"s143","loc":"post","quote":"","note":""}],"notes":""},{"id":"e5","date":"2022-09","end":"","prec":"month","thread":"service","key":false,"text":"Walter Isaacson's 2023 biography says that in September 2022 Ukraine attempted a Starlink-guided naval drone attack on the Russian fleet at Sevastopol, and that the drones lost connectivity near the target.","actors":"Elon Musk; Walter Isaacson; SpaceX; Ukrainian military; Russian Black Sea Fleet","cites":[{"src":"s8","loc":"para. 8, citing Isaacson's Washington Post excerpt","quote":"sneak attack on the Russian naval fleet based at Sevastopol","note":""},{"src":"s9","loc":"paras. 20–23","quote":"emergency request from government authorities to activate Starlink all the way to Sevastopol","note":""},{"src":"s10","loc":"para. 7","quote":"the Ukrainians THOUGHT coverage was enabled all the way to Crimea, but it was not.","note":""},{"src":"s11","loc":"paras. 3, 10–11","quote":"It will be corrected in subsequent editions.","note":""},{"src":"s12","loc":"paras. 1, 11","quote":"","note":""}],"notes":"The date is disputed: Isaacson places the attempt in September 2022, while CNN and Ukrainska Pravda give only '2022' or 'last year'. Whether coverage was switched off or never enabled is also disputed (see Disputes). The separate 29 October 2022 Sevastopol attack is listed as its own entry."},{"id":"e6","date":"2022-09","end":"","prec":"month","thread":"service","key":true,"text":"Reuters later reported (25 July 2025), citing three unnamed people, that Musk ordered a SpaceX engineer to cut Starlink coverage over areas including Kherson during Ukraine's autumn 2022 counteroffensive. Musk has denied giving such an order and SpaceX called the information inaccurate.","actors":"Elon Musk; SpaceX; Ukrainian armed forces","cites":[{"src":"s13","loc":"para. 1","quote":"Musk told a senior engineer at the California offices of SpaceX","note":""},{"src":"s14","loc":"para. 1; para. 3; para. 5","quote":"at least a hundred Starlink terminals","note":""},{"src":"s15","loc":"para. 1","quote":"in late September 2022","note":""},{"src":"s16","loc":"para. 1; para. 4","quote":"","note":""},{"src":"s144","loc":"","quote":"'We have to do this,' Michael Nicolls, the Starlink engineer, told colleagues upon receiving the order, one of these people said. Staffers complied, the three people told Reuters, deactivating at least a hundred Starlink terminals, their hexagon-shaped cells going dark on an internal map of the company’s coverage. The move also affected other areas seized by Russia, including some of Donetsk province further east.","note":""}],"notes":""},{"id":"e7","date":"2022-09","end":"","prec":"approx","thread":"kremlin","key":false,"text":"According to Isaacson's account, as reported by the Post and AFP, Musk spoke with the Russian ambassador to the United States. Isaacson writes that the ambassador explicitly told Musk a Ukrainian attack on Crimea would lead to a nuclear response.","actors":"Elon Musk; Russian ambassador to the US (reportedly Anatoly Antonov); Walter Isaacson","cites":[{"src":"s17","loc":"para. 15","quote":"explicitly told him that a Ukrainian attack on Crimea would lead to a nuclear response","note":""},{"src":"s18","loc":"para. 9","quote":"","note":""},{"src":"s11","loc":"para. 16","quote":"","note":""},{"src":"s145","loc":"","quote":"After publication of this adaptation, the author learned that his book mischaracterized the attempted attack by Ukrainian drones on the Russian fleet in Crimea. Musk had already disabled (\"geofenced\") coverage within 100 km of the Crimean coast before the attack began, and when the Ukrainians discovered this, they asked him to activate the coverage, and he refused. This version reflects that change.","note":""}],"notes":"Isaacson places the call around the September 2022 Crimea episode; no source gives an exact date. It became public with the 7 September 2023 excerpt. The news reports cited do not name the ambassador; the aggregator GlobalSecurity.org says the Post named Anatoly Antonov, which is unconfirmed."},{"id":"e8","date":"2022-10-03","end":"","prec":"exact","thread":"musk","key":false,"text":"Musk tweeted a proposed plan to end the war, including UN-supervised re-run votes in annexed regions and Crimea formally part of Russia, and asked users to vote yes or no. Ambassador Andriy Melnyk replied with an obscenity, and President Zelensky posted a counter-poll.","actors":"Elon Musk; Volodymyr Zelensky; Andriy Melnyk","cites":[{"src":"s19","loc":"para. 10; embedded tweets dated 3 Oct 2022","quote":"F— off is my very diplomatic reply to you @elonmusk","note":""},{"src":"s20","loc":"para. 2; paras. 5–6, 13","quote":"Which @elonmusk do you like more?","note":""},{"src":"s21","loc":"paras. 5, 7–8","quote":"Crimea formally part of Russia, as it has been since 1783 (until Khrushchev's mistake).","note":""},{"src":"s146","loc":"post","quote":"Ukraine-Russia Peace:\n- Redo elections of annexed regions under UN supervision. Russia leaves if that is will of the people.\n- Crimea formally part of Russia, as it has been since 1783 (until Khrushchev’s mistake).\n- Water supply to Crimea assured.\n- Ukraine remains neutral.","note":""},{"src":"s147","loc":"post","quote":"","note":""}],"notes":"Outlets censor Melnyk's reply differently; the Reuters copy on Dhaka Tribune prints it in full."},{"id":"e9","date":"2022-10-04","end":"","prec":"exact","thread":"kremlin","key":false,"text":"Kremlin spokesman Dmitry Peskov welcomed Musk's search for a peaceful settlement and said that on the referendums, people had voiced their opinion.","actors":"Dmitry Peskov; Elon Musk","cites":[{"src":"s22","loc":"para. 32","quote":"It's very positive that such a person as Elon Musk is trying to look for","note":""},{"src":"s148","loc":"post","quote":"","note":""}],"notes":"The date (4 Oct) comes from Global News's account. Second source comes from Elon Musk's response concerning his contact with the Kremlin."},{"id":"e10","date":"2022-10-07","end":"","prec":"approx","thread":"service","key":false,"text":"The Financial Times, citing unnamed Ukrainian officials, reported Starlink outages on front lines in eastern and southern Ukraine, including recently liberated areas, which one official called a 'catastrophic' loss of communication.","actors":"Ukrainian armed forces; SpaceX; Financial Times; Roman Sinicyn","cites":[{"src":"s23","loc":"para. 1","quote":"leading to a 'catastrophic' loss in communication","note":""},{"src":"s24","loc":"paras. 2, 7–8, 10–11, 13","quote":"the outages in recent weeks have occurred in Kherson and Zaporizhzhia regions","note":""},{"src":"s149","loc":"","quote":"Ukrainian troops have reported outages of their Starlink communication devices on the frontline, hindering efforts to liberate territory from Russian forces, according to its officials and soldiers.","note":""}],"notes":"The original Financial Times piece has been cited here with an eye-opening quote concerning Starlink cut-off for Ukraine. The Kyiv Independent summary is dated 7 Oct. DatacenterDynamics says SpaceX had not commented and quotes a Musk tweet that the operation had cost SpaceX $80m. The outages had been occurring 'in recent weeks', which overlaps the period of the later Reuters Kherson report."},{"id":"e11","date":"2022-10-11","end":"","prec":"exact","thread":"kremlin","key":true,"text":"Ian Bremmer wrote in an Oct 10 Eurasia Group note, and tweeted on Oct 11, that Musk had told him he had spoken with Putin and the Kremlin directly about Ukraine. Musk denied this on Oct 11, saying he had spoken to Putin only once, about 18 months earlier, about space. Bremmer stood by his account.","actors":"Ian Bremmer; Elon Musk; Vladimir Putin; Eurasia Group","cites":[{"src":"s25","loc":"paras. 1, 3; paras. 2, 6","quote":"I have spoken to Putin only once and that was about 18 months ago.","note":""},{"src":"s26","loc":"para. 4; para. 6","quote":"Elon Musk told me he had spoken with Putin and the Kremlin directly about Ukraine.","note":""},{"src":"s27","loc":"para. 23; paras. 4, 6","quote":"prepared to negotiate","note":""},{"src":"s28","loc":"para. 6","quote":"i write honestly without fear or favor and this week's update was no different.","note":""}],"notes":"Musk's denial said he had spoken to Putin only once, about 18 months earlier, and that the subject was space. Bremmer's newsletter note was dated 10 October and his tweet 11 October; he said his conversation with Musk had taken place two weeks earlier, roughly late September 2022. Global News reports Musk replied that Bremmer should not be trusted."},{"id":"e12","date":"2022-10-12","end":"","prec":"exact","thread":"kremlin","key":false,"text":"Kremlin spokesman Dmitry Peskov denied that Putin and Musk spoke before Musk published his peace proposals, and said the two had last spoken by phone about 18 months earlier.","actors":"Dmitry Peskov; Vladimir Putin; Elon Musk","cites":[{"src":"s29","loc":"paras. 1–2","quote":"No, that's not true,","note":""},{"src":"s30","loc":"summary","quote":"Peskov said the two men last spoke via telephone about 18 months ago.","note":""}],"notes":"TASS is Russian state media."},{"id":"e13","date":"2022-10-13","end":"","prec":"approx","thread":"usgov","key":false,"text":"CNN reported that SpaceX had sent the Pentagon a letter saying it could no longer fund Starlink in Ukraine as before. The letter asked the Pentagon to take over funding, estimated at more than $120 million for the rest of 2022 and close to $400 million over 12 months.","actors":"SpaceX; US Department of Defense; CNN; Valeriy Zaluzhnyi","cites":[{"src":"s31","loc":"paras. 1–5","quote":"We are not in a position to further donate terminals to Ukraine.","note":""},{"src":"s32","loc":"para. 6; paras. 1, 3","quote":"","note":""},{"src":"s150","loc":"","quote":"So far roughly 20,000 Starlink satellite units have been donated to Ukraine, with Musk tweeting on Friday the 'operation has cost SpaceX $80 million and will exceed $100 million by the end of the year.'","note":""}],"notes":"CNN's report carries a 13 October URL and a 14 October date. The date of SpaceX's letter itself is not given. Espreso reports that the documents include a July request from Gen. Valeriy Zaluzhnyi for nearly 8,000 more terminals."},{"id":"e14","date":"2022-10-14","end":"","prec":"exact","thread":"musk","key":false,"text":"Musk tweeted that Starlink support for Ukraine was costing SpaceX about $20 million a month, and that SpaceX was not asking to recoup past costs but could not fund the system indefinitely.","actors":"Elon Musk; SpaceX","cites":[{"src":"s33","loc":"para. 5","quote":"","note":""},{"src":"s32","loc":"para. 4","quote":"Musk tweeted that it was costing SpaceX $20 million a month","note":""},{"src":"s150","loc":"","quote":"","note":""},{"src":"s151","loc":"post","quote":"The hell with it … even though Starlink is still losing money & other companies are getting billions of taxpayer $, we’ll just keep funding Ukraine govt for free","note":""}],"notes":"On about 10 Oct 2022, Musk had given a figure of $80m to date (cited in DatacenterDynamics, para. 13)."},{"id":"e15","date":"2022-10-15","end":"","prec":"exact","thread":"musk","key":false,"text":"Musk reversed course on Twitter, saying SpaceX would keep funding Starlink for Ukraine's government for free even though Starlink was losing money.","actors":"Elon Musk; SpaceX","cites":[{"src":"s34","loc":"para. 4; paras. 2–3","quote":"even though Starlink is still losing money","note":""},{"src":"s35","loc":"para. 2","quote":"we'll just keep funding Ukraine govt for free","note":""}],"notes":""},{"id":"e16","date":"2022-10-29","end":"","prec":"exact","thread":"service","key":false,"text":"Russia said Ukraine attacked the Black Sea Fleet at Sevastopol with aerial and sea drones early on 29 Oct, claimed all were repelled, and said the minesweeper Ivan Golubets was damaged. Russia accused British specialists of helping plan the attack.","actors":"Russian Ministry of Defence; Mikhail Razvozhayev; Ukrainian military (alleged); Russian Black Sea Fleet","cites":[{"src":"s36","loc":"paras. 1–3, 8–9","quote":"All UAVs (unmanned aerial vehicles) have been shot down.","note":""},{"src":"s37","loc":"paras. 1, 3–6","quote":"nine UAVs and seven autonomous marine drones","note":""}],"notes":"Separate from the September 2022 attempt described by Isaacson; some coverage confuses the two. The details are Russian claims, not confirmed by Ukraine."},{"id":"e17","date":"2023-02-08","end":"","prec":"exact","thread":"musk","key":false,"text":"At a conference in Washington, D.C., SpaceX President Gwynne Shotwell said Ukraine had used Starlink in ways that were never intended, including in ways tied to weapons. She said SpaceX could limit, and had limited, that use. She gave no details. Presidential adviser Mykhailo Podolyak criticised her remarks the next day.","actors":"Gwynne Shotwell; SpaceX; Mykhailo Podolyak; Mykhailo Fedorov","cites":[{"src":"s38","loc":"para. 4","quote":"It was never intended to be weaponized.","note":""},{"src":"s39","loc":"para. 11","quote":"There are things that we can do, and have done.","note":""}],"notes":"Shotwell's quoted words do not mention drones; the drone context comes from the reporting. RFE/RL says she was answering questions about drones."},{"id":"e18","date":"2023-02-12","end":"","prec":"exact","thread":"musk","key":false,"text":"Replying on Twitter to former astronaut Scott Kelly, Musk said Starlink was Ukraine's communications backbone. He added that SpaceX would not enable escalation that could lead to World War III.","actors":"Elon Musk; Scott Kelly","cites":[{"src":"s40","loc":"para. 5 and embedded tweet","quote":"But we will not enable escalation of conflict that may lead to WW3.","note":""},{"src":"s152","loc":"post","quote":"You’re smart enough not to swallow media & other propaganda bs.\n\nStarlink is the communication backbone of Ukraine, especially at the front lines, where almost all other Internet connectivity has been destroyed.\n\nBut we will not enable escalation of conflict that may lead to WW3.","note":""}],"notes":""},{"id":"e19","date":"2023-06-01","end":"","prec":"exact","thread":"usgov","key":false,"text":"The Pentagon confirmed in a statement that it contracts with Starlink for satellite communications services for Ukraine. It withheld cost, timing and length of service, citing operational security. Bloomberg first reported the contract.","actors":"US Department of Defense; SpaceX/Starlink","cites":[{"src":"s41","loc":"para. 2","quote":"Satellite communications constitute a vital layer in Ukraine's overall communications network.","note":""},{"src":"s42","loc":"para. 3","quote":"the department contracts with Starlink for services of this type.","note":""}],"notes":"Defense News para. 6 gives $80 million as SpaceX's own reported cost of service since the invasion began. That is not the contract value, which was not disclosed."},{"id":"e20","date":"2023-08-21","end":"","prec":"exact","thread":"reporting","key":false,"text":"The New Yorker published Ronan Farrow's 'Elon Musk's Shadow Rule' (Aug. 28, 2023 issue). According to secondary reports of the piece, former Pentagon policy chief Colin Kahl recalled Musk saying in an October 2022 call that he had spoken with Putin. The piece also reported that US and Ukrainian officials believed SpaceX had cut off terminals in certain areas. Musk had publicly denied in October 2022 that he had discussed Ukraine with Putin.","actors":"Ronan Farrow; Elon Musk; Colin Kahl; Vladimir Putin","cites":[{"src":"s43","loc":"para. 8; para. 7","quote":"Well, I had this great conversation with Putin.","note":""},{"src":"s44","loc":"para. 2","quote":"volunteered the information during an October conversation with Colin Kahl.","note":""},{"src":"s45","loc":"para. 15","quote":"No. I spoke with Putin only once, and it was about 18 months ago.","note":""},{"src":"s46","loc":"link to the article","quote":"","note":""},{"src":"s153","loc":"","quote":"","note":""}],"notes":"Coverage of the piece describes outages or terminals being cut off; the word 'geofencing' appears later, in coverage of Isaacson's book. The print issue is dated 28 August 2023."},{"id":"e31","date":"2023-09","end":"","prec":"month","thread":"kremlin","key":false,"text":"Former Russian president Dmitry Medvedev praised Musk on X. He said that if Isaacson's account was true, Musk looked like 'the last adequate mind in North America.'","actors":"Dmitry Medvedev; Elon Musk","cites":[{"src":"s18","loc":"paras. 13–15","quote":"it looks like Musk is the last adequate mind in North America.","note":""},{"src":"s60","loc":"paras. 10–11","quote":"","note":""},{"src":"s48","loc":"para. 10","quote":"","note":""}],"notes":"The exact date of Medvedev's post is not given; coverage places it around 7–8 September 2023."},{"id":"e21","date":"2023-09-07","end":"","prec":"exact","thread":"reporting","key":true,"text":"CNN and The Washington Post published excerpts from Walter Isaacson's biography 'Elon Musk'. CNN's first version said Musk ordered engineers to turn off Starlink near the Crimean coast in 2022 to disrupt a Ukrainian drone-submarine attack on the Russian fleet. CNN later amended the text to say Musk ordered engineers 'not to turn on' the network. According to the excerpt, Musk feared a Russian nuclear response, a fear Isaacson ties to Musk's conversations with senior Russian officials.","actors":"Walter Isaacson; Elon Musk; CNN; The Washington Post","cites":[{"src":"s47","loc":"quoted CNN excerpt, para. 1","quote":"Elon Musk secretly ordered his engineers to turn off his company's Starlink satellite communications network","note":""},{"src":"s12","loc":"para. 1; para. 3; para. 5; para. 10","quote":"secretly ordered his engineers not to turn on his company's Starlink satellite communications network","note":""},{"src":"s9","loc":"paras. 1–4; para. 20","quote":"","note":""},{"src":"s154","loc":"","quote":"","note":""},{"src":"s145","loc":"","quote":"","note":""}],"notes":"The core of the dispute: CNN's original text said Musk had engineers turn Starlink off; its amended text says he ordered them not to turn it on."},{"id":"e22","date":"2023-09-07","end":"","prec":"exact","thread":"musk","key":false,"text":"Musk responded on X the same day. He said the Starlink regions in question were not activated and SpaceX had not deactivated anything. He said 'government authorities' had made an emergency request to activate Starlink to Sevastopol, and that agreeing would have made SpaceX complicit in a major act of war.","actors":"Elon Musk","cites":[{"src":"s48","loc":"para. 9","quote":"The Starlink regions in question were not activated. SpaceX did not deactivate anything,","note":""},{"src":"s49","loc":"para. 5","quote":"emergency request from government authorities to activate Starlink all the way to Sevastopol","note":""},{"src":"s50","loc":"para. 6","quote":"If I had agreed to their request, then SpaceX would be explicitly complicit","note":""},{"src":"s151","loc":"post","quote":"","note":""}],"notes":"Musk's posts, as several outlets quote them, said the intent of the request was to sink much of the Russian fleet at anchor. A later Musk post, quoted by the Washington Post via Stars and Stripes (para. 10), said neither he nor anyone at SpaceX had promised coverage over Crimea; its exact date is not confirmed."},{"id":"e23","date":"2023-09-07","end":"","prec":"exact","thread":"ukraine","key":false,"text":"Presidential adviser Mykhailo Podolyak said on X that by blocking the drone attack, Musk allowed the Russian fleet to fire Kalibr missiles at Ukrainian cities, and blamed ignorance and ego.","actors":"Mykhailo Podolyak; Elon Musk","cites":[{"src":"s51","loc":"paras. 6–7","quote":"Sometimes a mistake is much more than just a mistake.","note":""},{"src":"s52","loc":"paras. 6–7","quote":"This is the price of a cocktail of ignorance and big ego,","note":""},{"src":"s50","loc":"paras. 2, 7","quote":"","note":""}],"notes":""},{"id":"e24","date":"2023-09-08","end":"","prec":"approx","thread":"reporting","key":true,"text":"Isaacson posted a clarification on X. He said the Ukrainians thought coverage was enabled to Crimea but it was not, that they asked Musk to enable it, and that Musk declined. In a second post he said Musk now told him the policy had been set earlier and was only reaffirmed that night. The Washington Post appended a correction to its excerpt.","actors":"Walter Isaacson; Elon Musk; The Washington Post","cites":[{"src":"s53","loc":"para. 5; para. 8","quote":"the Ukrainians THOUGHT coverage was enabled all the way to Crimea, but it was not","note":""},{"src":"s11","loc":"para. 13","quote":"","note":""},{"src":"s54","loc":"para. 3; paras. 8–9; para. 13","quote":"abruptly turned off Ukraine's access to his Starlink satellite internet system last year.","note":""},{"src":"s156","loc":"post","quote":"To clarify on the Starlink issue: the Ukrainians THOUGHT coverage was enabled all the way to Crimea, but it was not. They asked Musk to enable it for their drone sub attack on the Russian fleet. Musk did not enable it, because he thought, probably correctly, that would cause a major war.","note":""}],"notes":"Snopes dates the first clarification to 8 September; CNBC says a follow-up came on 9 September. The Post's correction, as CNN reports it, says coverage had been 'disabled', unlike Musk's 'not activated', so the wording dispute remains."},{"id":"e25","date":"2023-09-08","end":"","prec":"approx","thread":"usgov","key":false,"text":"The Pentagon did not address the substance. It said it was aware of the coverage and, for operational security reasons, had not released more information. On Sept. 11, Air Force Secretary Frank Kendall said the episode raised questions about relying on commercial systems in wartime.","actors":"US Department of Defense; Frank Kendall; Gen. Mike Minihan; Andrew Hunter","cites":[{"src":"s17","loc":"paras. 11–12","quote":"","note":""},{"src":"s55","loc":"paras. 1, 5; para. 6; para. 9","quote":"SpaceX founder Elon Musk's refusal to allow Ukraine to use Starlink internet services to launch a surprise attack on Russian forces in Crimea last September has raised questions as to whether the U.S. military needs to be more explicit in future contracts that services or products it purchases could be used in war. [...]","note":""}],"notes":"The exact date of the Pentagon statement is not given; AFP published it on 9 September."},{"id":"e26","date":"2023-09-11","end":"","prec":"exact","thread":"musk","key":false,"text":"At the All-In Summit, Musk said US sanctions on Russia, which cover Crimea, meant Starlink could not be activated there without US government approval. He said there had been no such request from the US government.","actors":"Elon Musk","cites":[{"src":"s56","loc":"para. 3","quote":"This includes Crimea under sanctions.","note":""},{"src":"s57","loc":"chronology, items 5–6","quote":"","note":""},{"src":"s155","loc":"post","quote":"Elon Musk covertly instructed his engineers to deactivate Starlink's satellite communications network during a MAJOR Ukrainian offensive.\n\nThis action was taken to intentionally thwart a surprise attack by Ukraine against the Russian naval fleet [. ...]","note":""}],"notes":"Snopes dates the appearance to 11 September 2023."},{"id":"e27","date":"2023-09-12","end":"","prec":"approx","thread":"usgov","key":false,"text":"Sen. Elizabeth Warren called for Congress to investigate Musk's role and the Starlink contracts after the biography's claims.","actors":"Elizabeth Warren; Elon Musk","cites":[{"src":"s58","loc":"paras. 14–16","quote":"Congress needs to investigate how it is that one billionaire is off making public policy","note":""},{"src":"s59","loc":"para. 1","quote":"Isaacson details Musk's policy of geofencing Starlink's satellite network over Crimea last year.","note":""}],"notes":"'Geofencing' appears in this coverage of Isaacson's book."},{"id":"e28","date":"2023-09-12","end":"","prec":"exact","thread":"kremlin","key":false,"text":"Speaking at the Eastern Economic Forum in Vladivostok, Putin called Musk an outstanding person and a talented businessman. He did not mention the Starlink controversy.","actors":"Vladimir Putin; Elon Musk","cites":[{"src":"s60","loc":"para. 4","quote":"he is undoubtedly an outstanding person","note":""},{"src":"s61","loc":"para. 3","quote":"He is definitely an outstanding person, this must be recognised","note":""},{"src":"s62","loc":"paras. 2–3","quote":"an active, talented businessman","note":""}],"notes":"Translations differ: 'undoubtedly' (Al Jazeera) and 'definitely' (Ukrainska Pravda)."},{"id":"e29","date":"2023-09-14","end":"","prec":"exact","thread":"usgov","key":false,"text":"Senate Armed Services Committee Chairman Jack Reed said the committee was 'aggressively probing' the issue. He said no private citizen can have the last word on US national security.","actors":"Jack Reed; Senate Armed Services Committee; Elon Musk","cites":[{"src":"s63","loc":"para. 7","quote":"Neither Elon Musk, nor any private citizen, can have the last word","note":""},{"src":"s64","loc":"paras. 14–15","quote":"'We are deeply concerned with the ability and willingness of SpaceX to interrupt their service at Mr. Musk’s whim and for the purpose of handcuffing a sovereign country’s self-defense, effectively defending Russian interests.'","note":""}],"notes":""},{"id":"e30","date":"2023-09-15","end":"","prec":"exact","thread":"usgov","key":false,"text":"Sens. Warren, Shaheen and Duckworth, all on Senate Armed Services, wrote to Defense Secretary Lloyd Austin. They asked for details of any incidents in which Starlink service was disabled or restricted, for the contract terms on unilateral service changes, and for plans for redundant capabilities. They asked for a reply by Oct. 31, 2023.","actors":"Elizabeth Warren; Jeanne Shaheen; Tammy Duckworth; Lloyd Austin","cites":[{"src":"s65","loc":"para. 5","quote":"'Such reports appear to indicate that Mr. Musk’s decision provided de facto protection to Russian military assets which continue to launch strikes on Ukrainian population centers and critical infrastructure and enforce a Russian embargo on grain shipments in the Black Sea' [. ...] 'These actions have claimed the lives of tens of thousands of Ukrainians and driven an increase in global food prices, bringing the world to the brink of a food security crisis.'","note":""},{"src":"s64","loc":"para. 8","quote":"whether Mr. Musk has personally intervened to undermine a key U.S. partner","note":""}],"notes":"Axios first dated its story 13 September, before the letter, and updated it on 15 September. The letter itself: https://www.warren.senate.gov/imo/media/doc/Starlink.pdf"},{"id":"e32","date":"2023-10-01","end":"","prec":"approx","thread":"musk","key":false,"text":"Musk posted on X a meme mocking Zelensky's requests for aid. Podolyak and parliamentary speaker Ruslan Stefanchuk criticised it.","actors":"Elon Musk; Volodymyr Zelensky; Mykhailo Podolyak; Ruslan Stefanchuk","cites":[{"src":"s66","loc":"para. 4","quote":"When it's been five minutes and you haven't asked for a billion dollars in aid.","note":""}],"notes":"The date is inferred from AFP's timestamp (early 2 October, West Africa time), so likely 1 October in the US."},{"id":"e33","date":"2024-02-08","end":"","prec":"exact","thread":"musk","key":false,"text":"SpaceX's Starlink account said on X that SpaceX does no business with the Russian government or military, that Starlink does not work in Russia, and that the company has never sold Starlink there or shipped equipment there. The post came out while Ukrainian outlets were reporting that Russian forces were using Starlink terminals.","actors":"SpaceX; Starlink","cites":[{"src":"s67","loc":"para. 15–16","quote":"does not do business of any kind with the Russian Government or its military.","note":""},{"src":"s68","loc":"paras. 9–10","quote":"","note":""},{"src":"s157","loc":"post","quote":"SpaceX does not do business of any kind with the Russian Government or its military. \n \nStarlink is not active in Russia, meaning service will not work in that country. SpaceX has never sold or marketed Starlink in Russia, nor has it shipped equipment to locations in Russia. If Russian stores are claiming to sell Starlink for service in that country, they are scamming their customers. \n\nStarlink also does not operate in Dubai. Starlink cannot be purchased in Dubai nor does SpaceX ship there. Additionally, Starlink has not authorized any third-party intermediaries, resellers or distributors of any kind to sell Starlink in Dubai.\n\nIf SpaceX obtains knowledge that a Starlink terminal is being used by a sanctioned or unauthorized party, we investigate the claim and take actions to deactivate the terminal if confirmed.","note":""}],"notes":"The post came from the Starlink account; the Kyiv Independent attributes it to SpaceX."},{"id":"e34","date":"2024-02-11","end":"","prec":"exact","thread":"musk","key":false,"text":"Ukraine's military intelligence agency (HUR/GUR) said Russian forces were using Starlink terminals in occupied Donetsk Oblast and pointed to intercepted communications from the 83rd Assault Brigade. On X, Musk called reports that SpaceX sells terminals to Russia 'categorically false'.","actors":"Elon Musk; HUR (Ukrainian Defence Intelligence); Andrii Yusov","cites":[{"src":"s68","loc":"para. 3; paras. 5–7","quote":"A number of false news reports claim that SpaceX is selling Starlink terminals to Russia.","note":""},{"src":"s69","loc":"embedded post","quote":"no Starlinks have been sold directly or indirectly to Russia","note":""},{"src":"s67","loc":"paras. 3–9","quote":"","note":""}],"notes":"The February claims came from Ukraine's military intelligence (HUR) and the Ukrainian outlet Militarnyi (10 February). Defense intelligence spokesman Andrii Yusov later said Russia likely gets terminals through smuggling and third countries, not direct sales. The WSJ's black-market investigation is dated 9 April (see that entry)."},{"id":"e35","date":"2024-02-12","end":"","prec":"exact","thread":"musk","key":false,"text":"In an X Spaces forum with Republican senators, Musk argued against more US aid to Ukraine. He said there was 'no way in hell' Putin would lose and that Putin would be assassinated if he backed off.","actors":"Elon Musk; JD Vance; Ron Johnson; Mike Lee; Vivek Ramaswamy; David Sacks","cites":[{"src":"s70","loc":"para. 1; para. 8","quote":"If he were to back off, he would be assassinated,","note":""}],"notes":"The forum was on Monday, 12 February 2024."},{"id":"e36","date":"2024-03-06","end":"","prec":"exact","thread":"usgov","key":false,"text":"Reps. Jamie Raskin and Robert Garcia, House Oversight Democrats, wrote to SpaceX President Gwynne Shotwell. They asked about reported illegal acquisition and use of Starlink terminals by Russia in occupied Ukraine and about SpaceX's safeguards, with a March 20 deadline. SpaceX did not immediately comment.","actors":"Jamie Raskin; Robert Garcia; Gwynne Shotwell; SpaceX","cites":[{"src":"s71","loc":"paras. 2–3, 5–6","quote":"an invaluable resource for Ukrainians in their fight against Russia's brutal and illegitimate invasion","note":""},{"src":"s72","loc":"para. 4","quote":"We are concerned that you may not have appropriate guardrails and policies in place","note":""},{"src":"s73","loc":"para. 8; para. 12","quote":"Russia's use of Starlink satellite terminals would be in contravention of U.S. export controls","note":""}],"notes":"No public SpaceX reply to the letter has been found; all three outlets say SpaceX did not respond to requests for comment."},{"id":"e38","date":"2024-04","end":"","prec":"month","thread":"usgov","key":false,"text":"At the 2024 Space Symposium in Colorado Springs, Assistant Secretary of Defense for Space Policy John Plumb said the Pentagon could not compel SpaceX to cut off Russian users. He said DoD was working with Ukraine and SpaceX on Russian use of Starlink and called SpaceX 'a great partner'.","actors":"John Plumb; US Department of Defense; SpaceX; Ukraine","cites":[{"src":"s75","loc":"para. 2; para. 9","quote":"I don't think that DOD is in a position to make them do these things","note":""},{"src":"s76","loc":"para. 4; para. 9","quote":"Starlink is a commercial product. It's available on the commercial market.","note":""},{"src":"s158","loc":"","quote":"Although Russia has banned the use of Starlink, the satellite-internet service developed by Elon Musk’s SpaceX, middlemen have proliferated in recent months to buy the user terminals and ship them to Russian forces. That has eroded a battlefield advantage once enjoyed by Ukrainian forces, which also rely on the cutting-edge devices.","note":""}],"notes":"Nextgov's dateline is 12 April 2024; the remarks may have come a day or two earlier."},{"id":"e37","date":"2024-04-09","end":"","prec":"exact","thread":"reporting","key":false,"text":"A Wall Street Journal investigation, as summarized by the Kyiv Post, reported that Russia had worked for about a year to deploy Starlink on the Ukrainian front. It said the terminals come through black-market middlemen in Central Asia, Dubai and Southeast Asia. SpaceX and Musk did not respond to the WSJ.","actors":"Wall Street Journal; SpaceX; Elon Musk","cites":[{"src":"s74","loc":"paras. 1, 7, 13; para. 22","quote":"has been working for around a year to deploy Starlink","note":""},{"src":"s158","loc":"","quote":"Although Russia has banned the use of Starlink, the satellite-internet service developed by Elon Musk’s SpaceX, middlemen have proliferated in recent months to buy the user terminals and ship them to Russian forces. That has eroded a battlefield advantage once enjoyed by Ukrainian forces, which also rely on the cutting-edge devices.","note":""}],"notes":""},{"id":"e39","date":"2024-05-09","end":"","prec":"exact","thread":"usgov","key":false,"text":"Bloomberg reported that, according to outgoing space policy chief John Plumb, Pentagon work with SpaceX and Ukraine had blunted Russia's unauthorized battlefield use of Starlink.","actors":"John Plumb; US Department of Defense; SpaceX","cites":[{"src":"s77","loc":"","quote":"Starlink terminals continue to be advertised for sale in Russia on platforms such as e-commerce site Ozon. Their sellers say they function through subscriptions taken out in the name of residents of European countries where the technology is licensed, and they say that connections work — not within Russia’s heartlands but near border regions such as Ukraine’s occupied territories.\n\nThis week, however, users complained of unprecedented connectivity issues. On the messaging app Telegram one of the sellers recommended transferring onto a more expensive global service plan. Bloomberg hasn’t been able to independently verify whether those workarounds restore connectivity for illicit Starlink use in Russia.","note":""}],"notes":""},{"id":"e40","date":"2024-10-24","end":"","prec":"approx","thread":"kremlin","key":true,"text":"The Wall Street Journal reported, citing anonymous current and former US, European and Russian officials, that Musk had been in regular contact with Putin and senior Kremlin officials, including Sergei Kiriyenko, since late 2022. It also reported that Putin asked Musk not to activate Starlink over Taiwan as a favor to Xi Jinping. The Kremlin denied the report. Musk did not comment to the WSJ.","actors":"Elon Musk; Vladimir Putin; Sergei Kiriyenko; Xi Jinping; Wall Street Journal","cites":[{"src":"s78","loc":"","quote":"White House officials acknowledged the Journal’s story Friday. 'I’ve seen the reporting out of The Wall Street Journal,' said John Kirby, a spokesman for the National Security Council. 'I’m not a position to corroborate the veracity of those reports, and we would refer you to Mr. Musk to speak to his private communications.'","note":""},{"src":"s79","loc":"para. 9","quote":"Putin also asked Musk not to activate Starlink over Taiwan as a favor to Beijing.","note":""},{"src":"s80","loc":"source line","quote":"informed sources among current and former US, European and Russian officials","note":""},{"src":"s81","loc":"paras. 1–3, 5","quote":"","note":""},{"src":"s82","loc":"paras. 1–2, para. 7","quote":"","note":""},{"src":"s83","loc":"paras. 1–2","quote":"","note":""}],"notes":"The reporting rests on anonymous officials; AP separately says one anonymous person confirmed the contacts. White House officials told the WSJ they were unaware of them (Kyiv Independent, para. 10)."},{"id":"e41","date":"2024-10-25","end":"","prec":"exact","thread":"kremlin","key":false,"text":"Kremlin spokesman Dmitry Peskov called the WSJ report false. He said Putin and Musk had one phone call, before 2022, about technology, and no contacts after it. He suggested the story was a US election-campaign fabrication.","actors":"Dmitry Peskov; Kremlin; Vladimir Putin; Elon Musk","cites":[{"src":"s84","loc":"para. 2; paras. 5–10","quote":"It's all untrue, absolutely false information published in the newspaper,","note":""},{"src":"s82","loc":"paras. 35–37","quote":"After that, Musk had no contacts with Putin,","note":""},{"src":"s159","loc":"","quote":"'No, this is not true,' Kremlin spokesman Dmitry Peskov told reporters. Peskov said that Putin had one contact with Musk — the world's richest man — and it was before 2022.","note":""}],"notes":"Peskov's account of a single pre-2022 call matches Musk's own earlier 'only once' statement."},{"id":"e42","date":"2024-10-25","end":"","prec":"exact","thread":"musk","key":false,"text":"Musk did not answer the WSJ's request for comment. On X he attacked the newspaper and Ian Bremmer without directly denying the reported contacts. SpaceX called the article 'incredibly misleading' on the Taiwan point and said Taiwan has not licensed Starlink.","actors":"Elon Musk; SpaceX; Ian Bremmer","cites":[{"src":"s85","loc":"para. 7; para. 8 and embedded posts","quote":"is controlled by the (left wing) journalists union, not Rupert Murdoch!","note":""},{"src":"s86","loc":"para. 6","quote":"SpaceX has not accepted such a condition for any market in which it operates.","note":""},{"src":"s87","loc":"para. 10","quote":"","note":""}],"notes":"The posts' wording is as quoted by Fortune and SpaceNews. UPI said that as of the following day Musk had not responded publicly; the difference may come down to whether mocking posts count as a response."},{"id":"e43","date":"2024-10-25","end":"","prec":"exact","thread":"usgov","key":false,"text":"At Semafor's World Economy Summit, NASA Administrator Bill Nelson said he did not know whether the WSJ story was true but that it should be investigated. He said multiple Musk–Putin conversations, if they happened, would concern NASA, DoD and the intelligence agencies.","actors":"Bill Nelson; NASA; Elon Musk","cites":[{"src":"s88","loc":"para. 2","quote":"I don't know that that story is true. I think it should be investigated,","note":""},{"src":"s86","loc":"paras. 3–4, 7","quote":"","note":""},{"src":"s89","loc":"para. 4","quote":"","note":""}],"notes":"Nelson's remarks are dated 25 October 2024; CNBC also quoted him that day."},{"id":"e44","date":"2024-11-15","end":"","prec":"exact","thread":"usgov","key":false,"text":"Sens. Jeanne Shaheen and Jack Reed asked the DoD Inspector General and Attorney General Merrick Garland to review Musk's reported contacts with Putin and other Russian officials, including Kiriyenko, and whether his role in SpaceX contracts should be limited. In a separate letter they raised the Space Force's reliance on SpaceX with Air Force Secretary Frank Kendall. SpaceX did not comment.","actors":"Jeanne Shaheen; Jack Reed; Robert Storch; Merrick Garland; Frank Kendall; Elon Musk; SpaceX","cites":[{"src":"s90","loc":"para. 4","quote":"Mr. Musk's reported behavior could pose serious risks to national security.","note":""},{"src":"s91","loc":"p. 1, opening paragraph","quote":"Mr. Musk asserts that he holds a Top Secret level security clearance.","note":""},{"src":"s92","loc":"para. 5","quote":"pose serious questions regarding Mr. Musk's reliability as a government contractor and a clearance holder","note":""},{"src":"s93","loc":"paras. 2, 6, 8, 11, 12","quote":"","note":""},{"src":"s94","loc":"paras. 3, 6–7","quote":"","note":""}],"notes":"The letter does not mention Starlink or Taiwan; it cites the WSJ report, Kiriyenko and Starshield. The Justice Department confirmed it received the letter (The Hill, via shaheen.senate.gov)."},{"id":"e45","date":"2024-12-06","end":"","prec":"exact","thread":"usgov","key":false,"text":"Bloomberg reported that SpaceX had received a Pentagon contract, awarded in August 2024, to give 2,500 Starlink terminals already in Ukraine access to the encrypted military Starshield service. With an earlier contract that brings the total to 3,000 terminals. The value was not disclosed.","actors":"SpaceX; US Department of Defense; Space Systems Command Commercial Satellite Office; US European Command; Ukraine","cites":[{"src":"s95","loc":"paras. 1–2 and bullets","quote":"The contract means that 2,500 Starlink terminals already in Ukraine will get access to Starshield","note":""},{"src":"s96","loc":"para. 10; para. 12","quote":"A total of 3,000 terminals are provided service via the two contracts.","note":""},{"src":"s97","loc":"paras. 3, 5, 7","quote":"","note":""},{"src":"s139","loc":"Space Systems Command statement paragraph","quote":"","note":""}],"notes":"The contract was awarded in August 2024 and reported on 6 December. Coverage traces back to Bloomberg and a Space Systems Command statement. The contract value was not disclosed."},{"id":"e46","date":"2025-02-20","end":"","prec":"exact","thread":"musk","key":false,"text":"At CPAC, Newsmax's Rob Schmitt asked Musk about Russia's war in Ukraine. Musk joked that he could not be a Russian asset because Putin could not afford him.","actors":"Elon Musk; Vladimir Putin; Rob Schmitt","cites":[{"src":"s98","loc":"para. 3","quote":"he can't afford me.","note":""}],"notes":"Newsweek describes the remark as a joke that drew laughter."},{"id":"e47","date":"2025-02-21","end":"","prec":"approx","thread":"reporting","key":false,"text":"Reuters, citing three sources, reported that US negotiators seeking Ukrainian critical minerals raised the possibility of cutting Ukraine's Starlink access. One source said the issue came up again in a meeting between Keith Kellogg and Zelensky, and that Ukraine was told it faced imminent shutoff without a deal.","actors":"Reuters (Andrea Shalal; Joey Roulette); Scott Bessent; Keith Kellogg; Volodymyr Zelensky","cites":[{"src":"s99","loc":"para. 4","quote":"Ukraine runs on Starlink. They consider it their North Star","note":""},{"src":"s100","loc":"para. 2","quote":"Ukraine's continued access to SpaceX-owned Starlink was brought up in discussions","note":""},{"src":"s160","loc":"","quote":"Melinda Haring, a senior fellow with the Atlantic Council, said Starlink was essential for Ukraine’s operation of drones, a key pillar of its military strategy.\n\n'Losing Starlink would be a game changer,' Haring said, noting that Ukraine was now at 1:1 parity with Russia in terms of drone usage and artillery shells. Ukraine has a wide range of different drone capabilities, ranging from sea drones and surveillance drones to long-range unmanned aerial vehicles.","note":""}],"notes":"Reuters dates the report 22 February; the Kyiv Independent places it on 21 February (US time). The claims rest on anonymous sources; SpaceX, the White House and the Pentagon did not comment."},{"id":"e48","date":"2025-02-22","end":"","prec":"exact","thread":"musk","key":false,"text":"Musk denied the Reuters report on X, calling it false and accusing Reuters of lying. ","actors":"Elon Musk; Reuters","cites":[{"src":"s101","loc":"Musk post quoted in body","quote":"Reuters is lying.","note":""},{"src":"s102","loc":"section on Musk's response","quote":"","note":""},{"src":"s161","loc":"post","quote":"This is false. \n\nReuters is lying. They are second only to AP (Associated Propaganda) as legacy news liars.","note":""}],"notes":"That Reuters stood by its report comes only from Wikipedia's summary of the dispute."},{"id":"e49","date":"2025-03-04","end":"","prec":"exact","thread":"ukraine","key":false,"text":"Citing the Financial Times, Euromaidan Press reported that Eutelsat (owner of OneWeb) was in talks with European governments about extra satellite connectivity for Ukraine. On March 5, Polish Deputy PM and Digital Affairs Minister Krzysztof Gawkowski warned that cutting Ukraine's Starlink access could cause a crisis between Poland and the US.","actors":"Eutelsat/OneWeb; Krzysztof Gawkowski; European governments; EU","cites":[{"src":"s102","loc":"Eutelsat statement, early paras.","quote":"deployed swiftly in Ukraine to connect the most critical missions and infrastructures","note":""},{"src":"s103","loc":"Gawkowski para.; final para.","quote":"","note":""},{"src":"s162","loc":"","quote":"Eutelsat said its talks with European governments were focused on using a combination of its satellite constellations — OneWeb at about 1,200km above the earth and the Geo satellites at 35,000km — to strengthen satellite connectivity in Ukraine and the Black Sea region.","note":""}],"notes":"Euromaidan Press, drawing on the FT, reports that OneWeb has fewer than 700 satellites against Starlink's more than 7,000. The date of Gawkowski's warning (5 March) comes from the Kyiv Independent."},{"id":"e50","date":"2025-03-09","end":"","prec":"exact","thread":"musk","key":false,"text":"Replying to an X user, Musk wrote that he had challenged Putin to one-on-one combat over Ukraine, that his Starlink system was the 'backbone' of the Ukrainian army, and that its front line would collapse if he turned it off. He added that Ukraine would 'inevitably lose' a stalemate.","actors":"Elon Musk; Vladimir Putin","cites":[{"src":"s104","loc":"para. 4; para. 5","quote":"my Starlink system is the backbone of the Ukrainian army.","note":""},{"src":"s105","loc":"para. 4","quote":"I literally challenged Putin to one on one physical combat over Ukraine","note":""},{"src":"s106","loc":"lede","quote":"","note":""},{"src":"s163","loc":"post","quote":"I literally challenged Putin to one on one physical combat over Ukraine and my Starlink system is the backbone of the Ukrainian army. Their entire front line would collapse if I turned it off. \n\nWhat I am sickened by is years of slaughter in a stalemate that Ukraine will inevitably lose. \n\nAnyone who really cares, really thinks and really understands wants the meat grinder to stop. \n\nPEACE NOW!!","note":""}],"notes":"Musk's post is timestamped 9 March UTC (late 8 March in the US). A January 2026 Kyiv Post article misdates it to October 2025."},{"id":"e51","date":"2025-03-09","end":"","prec":"exact","thread":"ukraine","key":false,"text":"Polish FM Radosław Sikorski said Poland pays about $50 million a year for Ukraine's Starlink service and would look for other suppliers if SpaceX proved unreliable. Marco Rubio replied that no one had threatened to cut Ukraine off and told Sikorski to 'say thank you'. Musk told Sikorski: 'Be quiet, small man.'","actors":"Radosław Sikorski; Marco Rubio; Elon Musk","cites":[{"src":"s103","loc":"paras. 1–3","quote":"we will be forced to look for other suppliers","note":""},{"src":"s104","loc":"paras. 8–10","quote":"","note":""}],"notes":"The Kyiv Independent says Poland funds half of Ukraine's roughly 42,000 terminals, while Euromaidan Press says Poland had supplied 24,400 by the end of 2024."},{"id":"e52","date":"2025-03-09","end":"","prec":"exact","thread":"musk","key":false,"text":"Later the same day, Musk posted that however much he disagreed with Ukraine policy, Starlink would never turn off its terminals or use them as a bargaining chip.","actors":"Elon Musk","cites":[{"src":"s107","loc":"para. 1","quote":"Starlink will never turn off its terminals","note":""},{"src":"s104","loc":"paras. 13–14","quote":"","note":""}],"notes":""},{"id":"e53","date":"2025-04-16","end":"","prec":"exact","thread":"kremlin","key":false,"text":"Speaking to students at Bauman Moscow State Technical University, Putin praised Musk's Mars ambitions and compared him to Soviet rocket designer Sergei Korolev.","actors":"Vladimir Putin; Elon Musk","cites":[{"src":"s108","loc":"Putin quote in body","quote":"One might say, (Elon Musk) is crazy about Mars.","note":""}],"notes":"The 16 April date comes from the photo caption."},{"id":"e54","date":"2025-07-24","end":"","prec":"exact","thread":"service","key":false,"text":"A global Starlink outage of about 2.5 hours disrupted Ukrainian front-line units. SpaceX's Michael Nicolls blamed a failure of internal core-network software services and apologized.","actors":"SpaceX; Michael Nicolls; Robert 'Madyar' Brovdi","cites":[{"src":"s109","loc":"Brovdi statement","quote":"Starlink went down across the entire front.","note":""},{"src":"s110","loc":"background para. on July 24 outage","quote":"","note":""}],"notes":"This was a technical outage, not a reported deliberate cut-off."},{"id":"e55","date":"2025-07-25","end":"","prec":"exact","thread":"reporting","key":false,"text":"Reuters, citing three people familiar with the command, reported that Musk had told a senior SpaceX engineer to cut Starlink coverage over areas including Kherson during Ukraine's autumn 2022 counteroffensive, and that the outage hampered Ukrainian operations near Beryslav.","actors":"Elon Musk; SpaceX; Reuters; Ukrainian Armed Forces","cites":[{"src":"s16","loc":"para. 1","quote":"Musk instructed a senior engineer at SpaceX","note":""},{"src":"s111","loc":"impact and motive paras.","quote":"","note":""},{"src":"s15","loc":"paras. 1–2","quote":"","note":""},{"src":"s13","loc":"lede","quote":"","note":""},{"src":"s144","loc":"","quote":"According to three people familiar with the command, Musk told a senior engineer at the California offices of SpaceX, the Musk venture that controls Starlink, to cut coverage in areas including Kherson, a strategic region north of the Black Sea that Ukraine was trying to reclaim.","note":""}],"notes":"The 2022 date is reported loosely: 'late September 2022' (Mobile World Live, which adds part of Donetsk province) and 'autumn 2022' (Ukrainska Pravda). Ukrainska Pravda says at least 100 terminals went dark. Musk had previously denied disabling terminals, and SpaceX did not publicly confirm."},{"id":"e56","date":"2025-09-15","end":"","prec":"exact","thread":"service","key":false,"text":"A second Starlink outage hit Ukraine's front line from about 7:30 to 8:00 a.m. Kyiv time, according to unmanned systems commander Robert Brovdi. Starlink gave no cause.","actors":"SpaceX; Robert 'Magyar' Brovdi","cites":[{"src":"s110","loc":"Brovdi para.","quote":"the entire frontline in Ukraine","note":""}],"notes":""},{"id":"e57","date":"2026-01-27","end":"","prec":"exact","thread":"musk","key":false,"text":"Sikorski reposted an ISW report on Russian use of Starlink to guide drones and asked Musk why he did not stop it. Musk replied calling him a 'drooling imbecile' and repeated that Starlink is the backbone of Ukraine's military communications.","actors":"Radosław Sikorski; Elon Musk; Institute for the Study of War","cites":[{"src":"s112","loc":"embedded post after body para. 5","quote":"This drooling imbecile doesn't even realize that Starlink is the backbone of Ukraine military communications","note":""},{"src":"s113","loc":"Sikorski post","quote":"Making money from war crimes can damage your brand","note":""}],"notes":"LIGA's English page is machine-translated, so the Kyiv Post's wording of Musk's post is used. The 27 January date comes from the Kyiv Post."},{"id":"e58","date":"2026-01-29","end":"","prec":"exact","thread":"ukraine","key":false,"text":"New Defense Minister Mykhailo Fedorov said the ministry had contacted SpaceX within hours of Russian Starlink-equipped drones appearing over Ukrainian cities. He thanked Gwynne Shotwell and Musk.","actors":"Mykhailo Fedorov; SpaceX; Gwynne Shotwell; Elon Musk","cites":[{"src":"s114","loc":"Fedorov post para.","quote":"promptly contacted SpaceX and proposed ways to resolve the problem","note":""}],"notes":"ISW said Russia was using Starlink to extend the range of BM-35 drones."},{"id":"e59","date":"2026-02-01","end":"","prec":"exact","thread":"musk","key":false,"text":"Musk posted that SpaceX's steps to stop Russia's unauthorized use of Starlink appeared to have worked, and told Fedorov to let SpaceX know if more was needed. Fedorov said no Ukrainians had since been killed by Starlink-guided Russian drones.","actors":"Elon Musk; Mykhailo Fedorov; SpaceX","cites":[{"src":"s115","loc":"para. 1","quote":"the steps we took to stop the unauthorized use of Starlink by Russia have worked","note":""},{"src":"s116","loc":"Fedorov para.","quote":"no Ukrainians have been killed by Russian drones using Starlink","note":""}],"notes":"Later Ukrainian reporting says SpaceX's early measures included a speed limit on terminals; adviser Serhiy Beskrestnov cited 70–90 km/h (Kyiv Independent, 24 October 2026)."},{"id":"e60","date":"2026-02-02","end":"","prec":"exact","thread":"service","key":false,"text":"Ukraine's cabinet adopted a resolution creating a 'whitelist' of registered Starlink terminals, implemented with SpaceX. Unverified terminals would be disconnected. Civilians register through administrative centers or Diia, and the military through the DELTA platform.","actors":"Cabinet of Ministers of Ukraine; Mykhailo Fedorov; SpaceX","cites":[{"src":"s117","loc":"para. 5","quote":"as simple as possible","note":""},{"src":"s116","loc":"whitelist para.","quote":"","note":""}],"notes":"Neither article gives a deadline."},{"id":"e61","date":"2026-02-04","end":"","prec":"approx","thread":"service","key":false,"text":"Fedorov said Russian-used Starlink terminals had been blocked while Ukraine's whitelist was still being updated. A Russian military blog reported mass terminal failures from Wednesday evening (Feb. 4). Reuters could not verify the scale.","actors":"Mykhailo Fedorov; Serhiy Beskrestnov; SpaceX; Russian forces","cites":[{"src":"s118","loc":"Beskrestnov para.","quote":"All command of the troops has collapsed.","note":""},{"src":"s119","loc":"outcome para.","quote":"","note":""},{"src":"s164","loc":"","quote":"Under US sanctions, Starlink cannot be sold to or used by Russia. However, analysts and Ukrainian officials have warned that Russia has increasingly been finding ways to leverage the system to its own advantage. CNN previously reported on Russia’s practice of mounting Starlink systems on its attack drones, which allow the weapons to bypass Ukraine’s electronic defenses that disable drones by jamming GPS and radio signals, and to strike deeper into the country.","note":""}],"notes":"Euromaidan Press and LIGA (22 May 2026) cite a Pentagon/US intelligence assessment that Ukraine retook about 400 km² after the cut-off; this is unverified."},{"id":"e62","date":"2026-07-16","end":"","prec":"exact","thread":"ukraine","key":false,"text":"At a briefing, Fedorov described his first video call with Musk about Russian Starlink use, which he had rated at a '1% chance' of success. He called cutting Russia off his top achievement as defense minister. Zelensky dismissed Fedorov that month, and parliament confirmed Yevhen Khmara as his successor on Aug. 19, 2026.","actors":"Mykhailo Fedorov; Elon Musk; Volodymyr Zelensky; Yevhen Khmara","cites":[{"src":"s119","loc":"call para.","quote":"1% chance","note":""},{"src":"s120","loc":"paras. 1–3","quote":"","note":""}],"notes":"Fedorov said Musk required Ukraine to change its rules for Starlink buyers, which he called 'catastrophic' for business."},{"id":"e63","date":"2026-10-10","end":"","prec":"exact","thread":"musk","key":false,"text":"Commenting on video of Trump criticizing Zelensky for not settling with Russia, Musk posted on X that Zelensky 'has gone too far'. This came after Trump's Oct. 9 Russian diesel arrangement and his call for an 'energy ceasefire' on refinery strikes.","actors":"Elon Musk; Donald Trump; Volodymyr Zelensky","cites":[{"src":"s121","loc":"para. 1","quote":"has gone too far","note":""},{"src":"s122","loc":"context paragraphs","quote":"","note":""}],"notes":"10 October 2026 was a Saturday, matching Tom's Hardware's 'On Saturday'."},{"id":"e64","date":"2026-10-13","end":"","prec":"approx","thread":"service","key":true,"text":"Overnight Oct. 13-14, Ukrainian forces found their Starshield (military Starlink) terminals losing connection above about 160 km/h (100 mph), disrupting mid-range strike and interceptor-drone missions. Adviser Serhiy Beskrestnov said SpaceX gave no warning. SpaceX gave no reason.","actors":"SpaceX; Serhiy Beskrestnov; Serhiy Sternenko; 7th Rapid Reaction Corps","cites":[{"src":"s123","loc":"Beskrestnov para.","quote":"Our defence forces did not receive a warning about this limitation","note":""},{"src":"s124","loc":"speed cap and mission-impact paras.","quote":"","note":""}],"notes":"The onset date varies by source: 'late Tuesday' Oct. 13 (Newsweek), Oct. 14 (Kyiv Independent), and about Oct. 12 (Kyiv Independent analysis, Oct. 23). Ukrainian officials linked the cap to US pressure over refinery strikes; that link is their claim and is unproven. Sternenko reported drops at 60-70 km/h."},{"id":"e65","date":"2026-10-14","end":"","prec":"exact","thread":"musk","key":false,"text":"Musk posted that Starshield is owned and controlled by the US government and that any speed or usage limits are decided by the US military and ultimately the president. He said commercial Starlink is limited to civilian or defensive use.","actors":"Elon Musk","cites":[{"src":"s122","loc":"Musk post section","quote":"Any limits on speed or usage are decided by the US military and ultimately POTUS.","note":""},{"src":"s125","loc":"para. 12","quote":"","note":""}],"notes":""},{"id":"e66","date":"2026-10-15","end":"","prec":"exact","thread":"reporting","key":false,"text":"Reuters, citing two US officials and a Western official, reported that the order to slow Starshield for Ukraine came from inside the White House. The sources did not say who decided it. A senior US official denied that Trump made the request.","actors":"Reuters; White House; US Department of Defense; Donald Trump","cites":[{"src":"s126","loc":"senior official para.","quote":"No such request was ever made by the president","note":""},{"src":"s127","loc":"paras. 1–2","quote":"","note":""},{"src":"s165","loc":"","quote":"","note":""}],"notes":"BNO also quotes Zelensky warning that the decision would cost many lives."},{"id":"e67","date":"2026-10-15","end":"","prec":"approx","thread":"kremlin","key":false,"text":"According to TASS, Musk posted 'Time for Zelensky to go.' Russian envoy Kirill Dmitriev responded on X that 'Elon Musk wants peace.'","actors":"Elon Musk; Kirill Dmitriev","cites":[{"src":"s128","loc":"para. 1","quote":"And so the slaughter continues … Time for Zelensky to go.","note":""},{"src":"s129","loc":"para. 1","quote":"Elon Musk wants peace.","note":""}],"notes":"TASS is Russian state media, and no independent Western source for the post has been found. The year, 2026, is inferred from context."},{"id":"e68","date":"2026-10-16","end":"","prec":"exact","thread":"reporting","key":false,"text":"The Telegraph, citing four sources, reported that Musk proposed the Starshield speed caps to Trump, who agreed. Trump said he did not think he or Musk was responsible. The Kyiv Independent did not independently verify the Telegraph account.","actors":"The Telegraph; Elon Musk; Donald Trump","cites":[{"src":"s130","loc":"Telegraph source para.","quote":"The reality is that they were both in it.","note":""},{"src":"s125","loc":"paras. 13, 15","quote":"It wasn't me, and I don't think it was Elon.","note":""},{"src":"s166","loc":"","quote":"","note":""}],"notes":"The Kyiv Independent's headline says 'both in on it', while its body quote reads 'both in it'. Fortune reports Rubio called reports of a White House order 'categorically false' and said Ukraine lacked Starshield access, which Kyiv Independent analysis disputes."},{"id":"e69","date":"2026-10-16","end":"","prec":"approx","thread":"usgov","key":false,"text":"Nine senators from both parties, including Jeanne Shaheen and Thom Tillis, asked Pentagon Inspector General Platte Moring to investigate the Starlink/Starshield disruption and whether DoD or contractor actions contributed.","actors":"Jeanne Shaheen; Thom Tillis; Platte Moring; US Senate","cites":[{"src":"s131","loc":"request para.","quote":"remains unclear","note":""}],"notes":"ABC says the letter went out on Thursday, 15 October. Sen. Richard Blumenthal separately opened an inquiry on 23 October (Kyiv Independent, 24 October)."},{"id":"e70","date":"2026-10-21","end":"","prec":"approx","thread":"reporting","key":false,"text":"The Wall Street Journal reported, according to the Kyiv Independent, that Trump told Musk on Oct. 21 to lift the restrictions. Hegseth said the administration had not 'pulled anything back', and Rubio said the president had no role in such decisions.","actors":"Donald Trump; Elon Musk; Pete Hegseth; Marco Rubio; Wall Street Journal","cites":[{"src":"s132","loc":"administration statements; timeline","quote":"pulled anything back","note":""},{"src":"s133","loc":"WSJ para.","quote":"","note":""},{"src":"s167","loc":"","quote":"","note":""}],"notes":"The Kyiv Independent says the WSJ reported this on 23 October; CNBC's report is dated 22 October."},{"id":"e71","date":"2026-10-22","end":"","prec":"exact","thread":"usgov","key":false,"text":"Lawmakers from both parties and both chambers (Reps. Panetta, Fitzpatrick, Kaptur, Quigley, Costa; Sens. Kelly, Tillis, Slotkin) wrote to Hegseth. They urged him to expand the Starshield contract, renew unlimited-speed service, keep coverage including over Russia where needed, and consider the Defense Production Act.","actors":"Jimmy Panetta; Brian Fitzpatrick; Marcy Kaptur; Mike Quigley; Jim Costa; Mark Kelly; Thom Tillis; Elissa Slotkin; Pete Hegseth","cites":[{"src":"s134","loc":"list of requests","quote":"'The United States and Europe have made significant investments in Ukraine’s defense because of how a Russian victory would put our security at risk. Those investments should not be undermined by preventable disruptions to the communications infrastructure on which Ukrainian forces depend.'","note":""}],"notes":"The letter appears to be dated 22 October; the press release is dated 23 October."},{"id":"e72","date":"2026-10-23","end":"","prec":"exact","thread":"usgov","key":false,"text":"Trump said Musk 'put it back' without saying whether he himself had called Musk. Ukrainian officials, including chargé d'affaires Denys Sienik, said the limits remained.","actors":"Donald Trump; Elon Musk; Denys Sienik; Volodymyr Zelensky","cites":[{"src":"s135","loc":"Trump quote para.","quote":"The bottom line – he put it back.","note":""},{"src":"s132","loc":"timeline","quote":"","note":""}],"notes":"CNN updated the page after publication and changed its headline."},{"id":"e73","date":"2026-10-24","end":"","prec":"exact","thread":"service","key":false,"text":"Ukraine's Defense Ministry and Zelensky said Starlink/Starshield speeds were fully restored, with stable connections above 400 km/h. Defense Minister Khmara credited Zelensky's direct dialogue at the highest level.","actors":"Yevhen Khmara; Volodymyr Zelensky; Ukrainian Ministry of Defense","cites":[{"src":"s136","loc":"Khmara para.","quote":"direct dialogue and the firm position of the President of Ukraine","note":""},{"src":"s133","loc":"paras. 1–3","quote":"","note":""}],"notes":"CNN reports a source in Donetsk region saying speeds there were still capped at 160 km/h, so the extent of the recovery is unclear."},{"id":"e74","date":"2026-10-24","end":"","prec":"exact","thread":"musk","key":true,"text":"Musk posted that Ukraine's military 'violated Starlink terms of service' by using it for offensive drone strikes, and said 'that loophole was closed last week'. He also said Starshield is controlled by the US government and that the front line would collapse immediately without Starlink. Ukrainian figures Beskrestnov and Sternenko denied the accusation.","actors":"Elon Musk; Serhiy Beskrestnov; Serhiy Sternenko","cites":[{"src":"s137","loc":"Musk post paras.","quote":"That loophole was closed last week.","note":""},{"src":"s138","loc":"Oct. 24 post","quote":"Starshield, a different system, is controlled by the US government","note":""},{"src":"s133","loc":"Musk statements section","quote":"Were Starlink to be turned off, the Ukrainian front line would collapse immediately.","note":""}],"notes":"CNN dates the post to 'Saturday', which is Oct. 24, 2026. Beskrestnov says commercial Starlink in Ukraine has had a 70-90 km/h cap since winter and does not work over Russia. Sternenko says satellite-linked strike missions ran only on Starshield. Musk's 'loophole' claim and the 'closed last week' timing contrast with his Oct. 14 statement that the US government sets Starshield limits."}],"disputes":[{"title":"Crimea, September 2022: switched off or never switched on?","text":"Isaacson's excerpt as first published by CNN and the Washington Post said Musk had Starlink turned off near Crimea. Musk said the regions were never activated and he declined an emergency request to enable them; Isaacson then said coverage was never enabled, while the Post's correction, as CNN described it, still used the word 'disabled'.","refs":["e5","e21","e22","e24","e26"]},{"title":"When the Sevastopol drone attempt happened","text":"Isaacson places the Starlink-related attempt in September 2022. A separate, Russian-reported drone attack on Sevastopol took place on 29 October 2022; no source opened ties the two together, and some coverage blurs them.","refs":["e5","e16"]},{"title":"How often Musk has spoken with Putin","text":"Musk said in October 2022 that he had spoken to Putin only once, about space, roughly 18 months earlier, and Peskov said the same. Bremmer said Musk told him he had spoken with Putin about Ukraine; the New Yorker reported Colin Kahl's recollection that Musk said he had; the WSJ reported regular contact since late 2022, which the Kremlin called false.","refs":["e11","e12","e20","e40","e41"]},{"title":"Kherson cut-off in autumn 2022","text":"Reuters (July 2025) reported that Musk ordered coverage cut over areas including Kherson; Musk has denied giving such an order and SpaceX called the information inaccurate. Secondary versions date the order to September, late September, or autumn 2022.","refs":["e6","e10","e55"]},{"title":"Whether Musk responded to the WSJ's Putin report","text":"Fortune reported that Musk mocked the WSJ and Bremmer on X without denying the contacts; UPI said that as of the following day he had not responded publicly. The difference may be whether the mocking posts count as a response.","refs":["e42"]},{"title":"US pressure on Ukraine's Starlink access, February–March 2025","text":"Reuters, citing three sources, reported that US negotiators raised a Starlink cut-off in minerals talks. Musk called the report false and said Reuters was lying; Rubio said no one had threatened to cut Ukraine off.","refs":["e47","e48","e51"]},{"title":"Who decided the October 2026 Starshield speed cap","text":"Musk said Starshield limits are set by the US military and ultimately the president. Reuters reported the order came from inside the White House, which a senior official denied for Trump; the Telegraph reported Musk proposed the caps and Trump agreed; Trump said neither he nor Musk was responsible. On 24 October Musk said a 'loophole' in Ukraine's use had been closed the previous week.","refs":["e64","e65","e66","e68","e70","e74"]},{"title":"Whether service was fully restored on 24 October 2026","text":"Ukraine's Defense Ministry and Zelensky said speeds were fully restored; CNN reported a source in Donetsk region saying speeds there were still capped at about 160 km/h.","refs":["e72","e73"]}],"gaps":["Isaacson's book is cited through its excerpts and coverage of them, not by page.","The cited sources do not name the Russian ambassador Isaacson says Musk spoke to; only the aggregator GlobalSecurity.org names Anatoly Antonov.","Some posts by Musk and SpaceX are cited as quoted in news reports rather than from X directly.","A drone boat that washed up near Sevastopol around 21 September 2022 has not been linked to the Isaacson episode.","No reporting from 2025 or 2026 describes new direct contact between Musk and Putin.","Whether the 2024 Pentagon Starshield contract for Ukraine (3,000 terminals) was renewed or lapsed before October 2026 is not established.","The exact onset of the October 2026 Starshield cap varies across sources (about 12, 13 or 14 October).","Musk's reported 'Time for Zelensky to go' post rests only on Russian state media (TASS).","No public SpaceX reply has been found to the March 2024 Raskin–Garcia letter or the September 2023 Warren–Shaheen–Duckworth letter."]}}</script>

      if (!e.date) rows.push({ level: 'check', where: e.id, msg: 'Event ' + e.id + ' has no date, so it sorts to the end.' });
      if (!th[e.thread]) rows.push({ level: 'fix', where: e.id, msg: 'Event ' + e.id + ' points to a thread that no longer exists.' });
      if (!e.cites.length) rows.push({ level: 'fix', where: e.id, msg: 'Event ' + e.id + ' has no citation. Every entry needs a source a reader can follow.' });

        else if (!src[c.src]) rows.push({ level: 'fix', where: e.id, msg: 'Event ' + e.id + ' cites ' + c.src + ', which is not in the source list.' });

      });

      d.refs.forEach(function (r) { if (!ev[r]) rows.push({ level: 'fix', where: 'disputes', msg: 'Dispute "' + (d.title || i + 1) + '" points to ' + r + ', which is not an event.' }); });

    });

  }

  return { FORMAT: FORMAT, PALETTE: PALETTE, COLOR_NAMES: COLOR_NAMES, MONTHS: MONTHS, normDate: normDate, levelOf: levelOf, sortKey: sortKey, showDate: showDate, asDate: asDate, versionLabel: versionLabel, precLabel: precLabel,
    nextId: nextId, slug: slug, blank: blank, normalize: normalize, sortEvents: sortEvents, sourceState: sourceState, parseCSV: parseCSV, csvCell: csvCell, CSV_COLS: CSV_COLS,

})();
</script>
<script id="app">

  // ---------- helpers ----------

  }

  function fileName(ext) { return (TL.slug(P.meta.title) || 'timeline') + ext; }

  // ---------- theme ----------

  document.addEventListener('change', function (e) { if (e.target.id === 'theme') { lsSet(THEME_KEY, e.target.value); applyTheme(e.target.value); renderView(); } });

        .catch(function () { modal({ title: 'The example is not next to this page', body: '<p>The example lives in the repository at <code>examples/silk-road.json</code>. Download it and open it with <b>File → Open a file</b>.</p>', actions: [{ label: 'OK', primary: true }] }); });

  }
  function askReplace(fn) {

    var a = TL.audit(P, O, TYPES, TEXT_KEYS), fix = a.rows.filter(function (r) { return r.level === 'fix'; }).length;
    $('epane').innerHTML = '<div class="form" style="margin-block:16px 60px"><h2>Check the timeline</h2><p class="hint">' + a.events + ' events, ' + a.sources + ' sources. ' + (a.rows.length ? fix + ' to fix, ' + (a.rows.length - fix) + ' to check.' : '<span class="ok">Nothing to fix.</span>') + (a.unrated ? ' ' + a.unrated + ' source' + (a.unrated > 1 ? 's are' : ' is') + ' unrated; ratings are optional but expected on any source a reader might question.' : '') + '</p>' +
      '<div class="audit">' + a.rows.slice(0, 400).map(function (r) { return '<div class="item ' + r.level + '"><span class="lvl">' + r.level + '</span><span>' + esc(r.msg) + '</span>' + (eventOf(r.where) ? '<button class="btn small" data-goev="' + esc(r.where) + '">Open</button>' : sourceOf(r.where) ? '<button class="btn small" data-gosrc="' + esc(r.where) + '">Open</button>' : '<span></span>') + '</div>'; }).join('') + (a.rows.length > 400 ? '<p class="hint">…and ' + (a.rows.length - 400) + ' more.</p>' : '') + '</div></div>';
  }
  document.addEventListener('click', function (ev) {
    var g = ev.target.closest('[data-goev]'); if (g) { ui.eid = g.dataset.goev; ui.etab = 'events'; ui.eq = ''; return renderEdit(); }
    var s = ev.target.closest('[data-gosrc]'); if (s) { ui.sid = s.dataset.gosrc; ui.etab = 'sources'; ui.sq = ''; return renderEdit(); }
  });

  // ---------- top-level ----------
  function render() {
    document.title = P.meta.title + (PUBLISHED ? '' : ' · OSINT Timeline Builder');
    renderBar();
    $('view').hidden = ui.mode !== 'view'; $('edit').hidden = ui.mode !== 'edit';
    if (ui.mode === 'view') { ui.threads = ui.threads || null; renderView(); } else renderEdit();
  }
  window.addEventListener('beforeunload', function (e) { if (!PUBLISHED && fileDirty && !savedAt) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('dragover', function (e) { if (!PUBLISHED) e.preventDefault(); });
  document.addEventListener('drop', function (e) { if (PUBLISHED) return; e.preventDefault(); var f = e.dataTransfer.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { openText(f.name, String(r.result)); }; r.readAsText(f); });
  render();
  if (/^#[\w.-]+$/.test(location.hash) && eventOf(location.hash.slice(1))) setTimeout(function () { jump(location.hash.slice(1)); }, 150);
